[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#4d1ad09d78445f16688627de0819646fd655910e
board = pico
framework = arduino
board_build.core = earlephilhower
; 200 MHz at 1.15 V; the Arduino core raises the regulator above 133 MHz.
board_build.f_cpu = 200000000L
board_build.arduino.earlephilhower.usb_product = Talko 2 Drums 0.3
board_build.arduino.earlephilhower.usb_manufacturer = Polaxis
monitor_speed = 115200
build_unflags = -Os
build_flags = -O2
build_src_filter = +<*> -<bench/>
extra_scripts = pre:tools/engines_in_ram.py
