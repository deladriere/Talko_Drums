[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
; Raspberry Pi's 200 MHz rating for the RP2040; the core raises the regulator to 1.15 V above 133 MHz.
board_build.f_cpu = 200000000L
board_build.arduino.earlephilhower.usb_product = Talko 2 Drums 0.2
board_build.arduino.earlephilhower.usb_manufacturer = Polaxis
monitor_speed = 115200
build_unflags = -Os
build_flags = -O2
build_src_filter = +<*> -<bench/>
extra_scripts = pre:tools/engines_in_ram.py

; Voice costs on the device: send '?' over USB serial. Not a release image.
[env:bench]
extends = env:pico
board_build.arduino.earlephilhower.usb_product = Talko 2 Drums bench
build_src_filter = +<drum_engine.c> +<hortator_engine.c> +<effects.cpp> +<bench/>

[env:bench_flash]
extends = env:bench
extra_scripts =
